# Ready-made desktop images (internal/app/image.go), built by
# ci/build-image.sh: one line per image, <distro> <desktop> [<arch>].
# Adding a distro or desktop is one line here; the packages come from the
# installer itself (andronix install --image-build), so an image install
# ends up with the same packages as a package install.
#
# Optional per-distro base override (when not our own base tarball):
#   base:<distro> <url of a rootfs tarball>   (sha256 from <url>.sha256 or SHA256SUMS)

debian xfce
ubuntu xfce
ubuntu24 xfce
kali xfce
fedora xfce
arch xfce
manjaro xfce
alpine xfce
void xfce

