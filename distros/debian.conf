# Debian 13 "trixie". One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=debian
DISTRO_NAME="Debian"
DISTRO_VERSION="13"
DISTRO_CODENAME="trixie"

# Package-manager family: families/<family>.sh
DISTRO_FAMILY=apt

# OCI image used by CI to build the tarball, and by the registry fallback.
DISTRO_IMAGE="docker.io/library/debian:13"

# CPUs we ship (Andronix names: aarch64 arm i686 x86_64).
DISTRO_ARCHES="aarch64 arm i686 x86_64"

# Login shell inside the distro.
DISTRO_SHELL=/bin/bash

# Extra packages every install gets, and the browser for desktop installs.
DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps"
DISTRO_BROWSER="firefox-esr"
DISTRO_BROWSER_CODECS="libavcodec-extra"

# Approximate sizes for the free-space check (MB).
DISTRO_DOWNLOAD_MB=60
DISTRO_DISK_MB=250

# Compatibility with the old installers and the app.
DISTRO_START_SCRIPTS="start-debian.sh"
DISTRO_LEGACY_FS="debian-fs"
DISTRO_BINDS_DIR="debian-binds"
DISTRO_ALIASES="debian13 trixie Debian"
# When the package servers can't be reached (after retries), switch the
# image's sources from the first URL to the next one (checked Oct 2026).
DISTRO_MIRROR_FALLBACK="http://deb.debian.org/debian http://ftp.debian.org/debian http://mirrors.tuna.tsinghua.edu.cn/debian; http://deb.debian.org/debian-security http://security.debian.org/debian-security http://mirrors.tuna.tsinghua.edu.cn/debian-security"
