# Ubuntu 24.04 LTS "Noble Numbat", for the app's Ubuntu18 and Ubuntu20 keys. One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=ubuntu24
DISTRO_NAME="Ubuntu"
DISTRO_VERSION="24.04"
DISTRO_CODENAME="noble"

DISTRO_FAMILY=apt
DISTRO_IMAGE="docker.io/library/ubuntu:24.04"
# Ubuntu 24.04 has no i386 build.
DISTRO_ARCHES="aarch64 arm x86_64"
DISTRO_SHELL=/bin/bash

DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps adduser"
# Ubuntu's own firefox package is a snap, and snaps can't run under proot.
# Use Mozilla's APT repository instead (arm64 and amd64 only), and pin
# snapd away so nothing pulls it in.
DISTRO_BROWSER="firefox"
DISTRO_BROWSER_CODECS="libavcodec-extra"
DISTRO_BROWSER_REPO="mozilla"
DISTRO_BROWSER_ARCHES="aarch64 x86_64"
DISTRO_NO_SNAP=1

DISTRO_DOWNLOAD_MB=35
DISTRO_DISK_MB=200

# Compatibility. The docs use start-ubuntu.sh (Ubuntu 18.04) and
# start-ubuntu20.sh (Ubuntu 20.04); both keys now install 24.04.
DISTRO_START_SCRIPTS="start-ubuntu.sh start-ubuntu20.sh"
DISTRO_LEGACY_FS="ubuntu-fs ubuntu20-fs"
DISTRO_BINDS_DIR="ubuntu-binds"
DISTRO_ALIASES="ubuntu2404 noble ubuntu18 ubuntu20 Ubuntu18 Ubuntu20"
# When the package servers can't be reached (after retries), switch the
# image's sources from the first URL to the next one that answers and isn't
# behind the lists apt already has (checked Nov 12 2026: tu-chemnitz and
# tuna 12 hours behind ports.ubuntu.com). mirrors.ocf.berkeley.edu comes
# last: it had not synced ubuntu-ports since Nov 8 (support #5242, card #399).
DISTRO_MIRROR_FALLBACK="http://ports.ubuntu.com/ubuntu-ports/ http://ftp.tu-chemnitz.de/pub/linux/ubuntu-ports/ http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports/ http://mirrors.ocf.berkeley.edu/ubuntu-ports/"
# Disk an install with XFCE needs at its peak (download, image, packages,
# Firefox), measured on an Android 16 emulator on Oct 5 2026 (max of peak,
# final and rootfs size). The space check scales it for other desktops.
DISTRO_XFCE_MB=1138
# Xvfb, for the standalone app's built-in display (andronix display)
DISTRO_XVFB=xvfb
# PulseAudio inside the distro, for the standalone app's sound (its
# module-simple-protocol-unix streams the PCM to the app). Termux mode uses
# Termux's PulseAudio instead.
DISTRO_PULSE=pulseaudio
