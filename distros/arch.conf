# Arch Linux (rolling). One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=arch
DISTRO_NAME="Arch Linux"
DISTRO_VERSION="rolling"
DISTRO_CODENAME=""

# Package-manager family: pacman.
DISTRO_FAMILY=pacman

# The official image is x86_64 only. ARM CPUs come from Arch Linux ARM's
# own rootfs tarballs, which CI turns into our tarball (ci/build-rootfs.sh):
# DISTRO_UPSTREAM_TARBALL_<arch> wins over DISTRO_IMAGE for that CPU, and
# DISTRO_UPSTREAM_REMOVE lists the packages CI strips from it (kernel,
# firmware, boot and network tools a proot never uses). There is no
# registry fallback for ARM: the tarball has to be published.
DISTRO_IMAGE="docker.io/library/archlinux:latest"
DISTRO_UPSTREAM_TARBALL_aarch64="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
# armv7 source, kept for when 32-bit is tested; unused while "arm" is out of DISTRO_ARCHES below.
DISTRO_UPSTREAM_TARBALL_arm="http://os.archlinuxarm.org/os/ArchLinuxARM-armv7-latest.tar.gz"
DISTRO_UPSTREAM_REMOVE="linux-aarch64 linux-armv7 linux-firmware dhcpcd netctl openssh net-tools"

# CPUs we ship (Andronix names: aarch64 arm i686 x86_64). No i686: Arch
# dropped it (archlinux32 is a separate project). No arm (armv7) yet: the
# Arch Linux ARM armv7 tarball above is neither built by CI nor tested under
# proot (docs/ports/arch.md), so it stays out of DISTRO_ARCHES — the app
# greys Arch on 32-bit phones with "Not tested on 32-bit phones yet" (same as
# Fedora/Manjaro) and the installer refuses it (no_build_for_your_cpu). Add
# "arm" back here once an armv7 install is verified under proot, and tell
# android to un-grey it.
DISTRO_ARCHES="aarch64 x86_64"

DISTRO_SHELL=/bin/bash

DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps-ng which"
DISTRO_BROWSER="firefox"

# Refresh the keyring before the first upgrade (#1230/#450): the keyring the
# base image ships goes stale as upstream rotates signing keys, so packages
# signed by newer keys fail with "invalid or corrupted package (PGP
# signature)". Pull the current keyring package (whichever the image has), then
# re-populate so the new keys are trusted before the upgrade downloads anything.
# If that itself fails because the master key rotated out of the stale keyring,
# fall back to a keyserver refresh with a timeout. Best-effort: never worse than
# today, so it ends with `true` and doesn't fail the "preparing for updates" step.
# A bare `pacman-key --populate` loads every keyring under
# /usr/share/pacman/keyrings (archlinux, archlinuxarm, manjaro, manjaro-arm),
# so the ARM keyrings need no separate --populate archlinuxarm (#354).
DISTRO_PRE_UPGRADE='h=; for k in archlinux-keyring archlinuxarm-keyring manjaro-keyring; do pacman -Si $k >/dev/null 2>&1 && h="$h $k"; done; if [ -n "$h" ]; then pacman -Sy --needed --noconfirm $h || { timeout 180 pacman-key --refresh-keys >/dev/null 2>&1; pacman -Sy --needed --noconfirm $h; }; fi; pacman-key --populate; true'

# Approximate sizes for the free-space check (MB).
DISTRO_DOWNLOAD_MB=180
DISTRO_DISK_MB=650

# Compatibility with the old installers and the app.
DISTRO_START_SCRIPTS="start-arch.sh"
DISTRO_LEGACY_FS="arch-fs"
DISTRO_BINDS_DIR="arch-binds"
DISTRO_ALIASES="archlinux arch-linux alarm Arch"
# Disk an install with XFCE needs at its peak (download, image, packages,
# Firefox), measured on an Android 16 emulator on Oct 5 2026 (max of peak,
# final and rootfs size). The space check scales it for other desktops.
DISTRO_XFCE_MB=2467
# Xvfb, for the standalone app's built-in display (andronix display)
DISTRO_XVFB=xorg-server-xvfb
# PulseAudio inside the distro, for the standalone app's sound (its
# module-simple-protocol-unix streams the PCM to the app). Termux mode uses
# Termux's PulseAudio instead.
DISTRO_PULSE=pulseaudio
