# Manjaro ARM. One file per distro; see DESIGN.md section 3.
# Sourced by bash: plain KEY=value, no commands.

DISTRO_ID=manjaro
DISTRO_NAME="Manjaro"
DISTRO_VERSION="stable"
DISTRO_CODENAME=""

DISTRO_FAMILY=pacman

# arm64 and amd64 both exist. On arm64 the image's mirrorlist already uses
# the arm-stable/$repo/$arch layout; DISTRO_MIRROR replaces it with the
# Manjaro CDN so users outside the US don't hit the image's 5 US mirrors.
# Single quotes: $repo and $arch are pacman's, written as-is.
DISTRO_IMAGE="docker.io/manjarolinux/base:latest"
DISTRO_MIRROR_aarch64='https://mirrors.manjaro.org/repo/arm-stable/$repo/$arch'
DISTRO_MIRROR_x86_64='https://mirrors.manjaro.org/repo/stable/$repo/$arch'

DISTRO_ARCHES="aarch64 x86_64"

DISTRO_SHELL=/bin/bash
# Manjaro ARM has no C.UTF-8 locale; en_US.UTF-8 is already generated.
DISTRO_LANG="en_US.UTF-8"

DISTRO_BASE_PKGS="sudo nano wget ca-certificates tzdata procps-ng which"
DISTRO_BROWSER="firefox"

# Refresh the keyring before the first upgrade (#1091/#450): the keyring the
# base image ships goes stale as upstream rotates signing keys, so packages
# signed by newer keys fail with "invalid or corrupted package (PGP
# signature)". Pull the current keyring package (whichever the image has), then
# re-populate so the new keys are trusted before the upgrade downloads anything.
# If that itself fails because the master key rotated out of the stale keyring,
# fall back to a keyserver refresh with a timeout. Best-effort: never worse than
# today, so it ends with `true` and doesn't fail the "preparing for updates" step.
# A bare `pacman-key --populate` loads every keyring under
# /usr/share/pacman/keyrings (archlinux, archlinuxarm, manjaro, manjaro-arm),
# so the ARM keyrings need no separate --populate archlinuxarm (#354).
DISTRO_PRE_UPGRADE='h=; for k in manjaro-keyring manjaro-arm-keyring archlinux-keyring archlinuxarm-keyring; do pacman -Si $k >/dev/null 2>&1 && h="$h $k"; done; if [ -n "$h" ]; then pacman -Sy --needed --noconfirm $h || { timeout 180 pacman-key --refresh-keys >/dev/null 2>&1; pacman -Sy --needed --noconfirm $h; }; fi; pacman-key --populate; true'

DISTRO_DOWNLOAD_MB=320
DISTRO_DISK_MB=1100

DISTRO_START_SCRIPTS="start-manjaro.sh"
DISTRO_LEGACY_FS="manjaro-fs"
DISTRO_BINDS_DIR="manjaro-binds"
DISTRO_ALIASES="manjaro-arm Manjaro"

# Added on master for the Go installer: Manjaro ARM stable's sudo refuses
# to run under proot (docs/ports/manjaro.md), so no sudoers entry; the
# first user is told to use `andronix start manjaro --root` for admin tasks.
DISTRO_SUDO=none
# Disk an install with XFCE needs at its peak (download, image, packages,
# Firefox), measured on an Android 16 emulator on Oct 5 2026 (max of peak,
# final and rootfs size). The space check scales it for other desktops.
DISTRO_XFCE_MB=2374
# Xvfb, for the standalone app's built-in display (andronix display)
DISTRO_XVFB=xorg-server-xvfb
# PulseAudio inside the distro, for the standalone app's sound (its
# module-simple-protocol-unix streams the PCM to the app). Termux mode uses
# Termux's PulseAudio instead.
DISTRO_PULSE=pulseaudio
